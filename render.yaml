# Render Blueprint — deploys the ADAS risk API as a Docker web service.
# In the Render dashboard: New +  ->  Blueprint  ->  connect this repo.
# Render auto-detects this file and provisions the service below.
services:
  - type: web
    name: fleet-adas-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # The data lake + model are baked into the image at build time, so the
    # free-tier runtime only serves requests. $PORT is injected by Render and
    # honored by docker/entrypoint.sh.
